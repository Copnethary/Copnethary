# 传送点名字最大长度
max-name-length: 24
# 聊天输入的超时时间（秒）
input-timeout-seconds: 60
# 登录/重生时若背包里没有传送信标/罗盘则自动补发
auto-give: true

# ---- 传送点可见标记（Java / 基岩版通用）----
marker:
  # 信标上方的悬浮名牌（%name% = 传送点名字，& = 颜色码）
  label: true
  label-format: "&b★ 传送点：&f%name%"
  locked-label-format: "&c[已锁定] &6传送点：&f%name%"
  label-height: 1.25
  # 普通传送点周围的淡青色粒子
  particles: true
  # 已锁定信标周围的红色粒子"屏障圈"（纯视觉，不是实体方块）
  locked-ring: true
  locked-ring-radius: 1.5
  locked-ring-layers: 3
  # 粒子刷新间隔（tick，最小 5）和可见距离（只有附近有玩家时才生成）
  particle-interval-ticks: 10
  particle-view-distance: 24

# ---- 传送（1.1.6 新增）----
teleport:
  # 传送成功后多少秒内不能再次传送（0 = 不限制），用来节省服务器资源。
  # 拥有 teleportbeacon.bypass-cooldown 权限的玩家不受限制（默认谁都没有，OP 也没有）。
  cooldown-seconds: 30
  # true = 调用原版 /tp 指令传送（execute in <维度> run minecraft:tp ...，推荐）
  # false = 用插件 API 传送（效果与原版 /tp 相同）。原版指令不可用时会自动改用 API。
  use-vanilla-tp: true
  # 传送前在后台（不卡主线程）预热信标周围多少圈区块，玩家落地后地形显示更快。
  # 0 = 只加载找落脚点必须的区块；最大 2。只读取已生成的区块，不会生成新地形。
  preload-radius: 1
  # 目标区块最长等待多少秒，超时则取消本次传送（不计冷却）
  load-timeout-seconds: 10
